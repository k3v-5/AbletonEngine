[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ableton-engine"
version = "1.0.0"
description = "Autonomous AI-Assisted Music Production, Mixing, and Mastering Middleware for Ableton Live 12 Suite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AbletonEngine Core Team" }
]
dependencies = [
    "numpy>=2.0.0",
    "soundfile>=0.12.0",
    "networkx>=3.0",
    "mcp>=1.2.0",
    "pydantic>=2.0.0",
    "opentelemetry-api>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
